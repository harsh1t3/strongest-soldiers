# Bandit is a security linter for Python code. It fails the build on issues of medium or higher severity
# (and medium or higher confidence) in the library code. It runs the bandit CLI directly instead of uploading
# SARIF results, since code scanning uploads need GitHub Code Security on private repositories.

name: Bandit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '40 14 * * 0'

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r tinytroupe --severity-level medium --confidence-level medium
