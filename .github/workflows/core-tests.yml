# Runs the TinyTroupe core test suite (real LLM calls) on demand.
# Core tests validate critical functionality and typically complete in ~1 hour.
# Slow tests are excluded for faster CI feedback. Every push/PR runs the offline tests instead (offline-tests.yml).
#
# Required secret:
#   OPENAI_API_KEY — an OpenAI API key with access to the models configured
#                    in config.ini (default: gpt-5-mini).

name: Core Tests

on:
  workflow_dispatch:          # needs the OPENAI_API_KEY secret, so it runs only when triggered manually

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180       # safeguard against runaway LLM calls

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Use OpenAI for the LLM tests
        # the repository defaults to API_TYPE=claude_code, which needs a logged-in Claude Code CLI that runners
        # don't have; these tests run against OpenAI (and its response cache) instead
        run: sed -i -e 's/^API_TYPE=.*/API_TYPE=openai/' -e 's/^MODEL=.*/MODEL=gpt-5-mini/' -e 's/^REASONING_MODEL=.*/REASONING_MODEL=o3-mini/' config.ini

      - name: Restore API cache
        uses: actions/cache/restore@v4
        with:
          path: openai_api_cache.json
          key: openai-api-cache-${{ github.run_id }}
          restore-keys: |
            openai-api-cache-

      - name: Run core tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest -s --use_cache -m "core and not slow" --cov=tinytroupe --cov-report=html --cov-report=xml --junit-xml=test-results.xml --html=test-report.html --self-contained-html

      - name: Save API cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openai_api_cache.json
          key: openai-api-cache-${{ github.run_id }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            test-report.html
