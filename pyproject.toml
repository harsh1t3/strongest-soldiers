[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tinytroupe*"]

[project]
name = "tinytroupe"
version = "0.7.0"
authors = [
  { name="Paulo Salem", email="paulo.salem@microsoft.com" }
]
description = "LLM-based people simulation for design, validation and insight generation in business."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "pandas",
    "numpy",
    "openai >= 1.65",
    "httpx",
    "tiktoken",
    "rich", "requests", "chevron",
    # only the llama-index parts actually used (the "llama-index" metapackage adds unused LLM clients and nltk,
    # and no longer includes the file readers needed for PDF/DOCX grounding)
    "llama-index-core", "llama-index-readers-file", "docx2txt",
    "llama-index-embeddings-openai", "llama-index-embeddings-azure-openai",
    # local embeddings for the default API_TYPE=claude_code (Claude has no embeddings API)
    "fastembed",
    "pypandoc", "markdown",
    "matplotlib",
    "seaborn",
    "pydantic>=2.5.0",
    "textdistance",
    "scipy"
]

[project.optional-dependencies]
ui = ["ipywidgets", "ipython"]
# reading web pages into agents' memory (pulls in browser/scraper packages)
web = ["llama-index-readers-web"]
dev = [
    "pytest", "pytest-cov", "pytest-timeout", "pytest-html",
    "jupyter", "nbformat", "nbconvert", "python-docx",
    "llama-index-readers-web",  # the web grounding tests
]

[project.urls]
"Homepage" = "https://github.com/microsoft/tinytroupe"

[tool.pytest.ini_options]
pythonpath = [
  "."
]

testpaths = [
  "./tests/"
]

markers = [
  "examples: mark a test as the execution of examples",
  "notebooks: mark a test as a more specific Jupyter notebook execution example",
  "core: mark a test as a core test for quick validation after important modifications",
  "slow: mark a test as slow running (excluded from core tests)",
  "gpt41mini: mark a test for gpt-4.1-mini model compatibility testing",
]
# coverage/HTML/JUnit reports are requested explicitly (see the CI workflows), not on every local run